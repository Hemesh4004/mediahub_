spring.application.name=mediahub



# Server Port
server.port=8086

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mediahub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO

logging.level.com.mediahub.subscriptionPlan=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n


management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true



info.app.name=Subscription Plan Service
info.app.version=1.0
info.app.description=MediaHub Subscription Plan Microservice


# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html



